services:
  - type: web
    name: social-washing-scan-python
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt && python methodology_pdf.py"
    startCommand: "python app.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MAX_REQUEST_BYTES
        value: "12000000"
      - key: RATE_LIMIT_SCANS
        value: "5"
      - key: RATE_LIMIT_REPORTS
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
      - key: MAX_CONCURRENT_SCANS
        value: "2"
      # Crawl-coverage upgrade (2026-08-31): raised to the maximum each variable's own
      # clamp in app.py allows (see CRAWL_TARGET_EXTRA_PAGES etc. near the top of app.py --
      # each is bounded by max(...,min(...)) regardless of what's set here, so these values
      # cannot push the app past a safe range). Widens how many pages/documents and external
      # search results a scan covers; pair with a paid Render instance type (dedicated CPU,
      # no cold-start spin-down) so the larger budget doesn't just make scans proportionally
      # slower on the free tier's shared/throttled CPU.
      - key: CRAWL_TARGET_EXTRA_PAGES
        value: "10"
      - key: CRAWL_MAX_PAGE_ATTEMPTS
        value: "24"
      - key: CRAWL_BUDGET_SECONDS
        value: "35"
      - key: CRAWL_FETCH_WORKERS
        value: "5"
      - key: EXTERNAL_SIGNAL_MAX_QUERIES
        value: "8"
      - key: EXTERNAL_SIGNAL_RESULTS_PER_QUERY
        value: "10"
      - key: EXTERNAL_SIGNAL_WORKERS
        value: "6"
      # Optional scan-history log (2026-09-01): both unset by default via `sync: false` --
      # Render will prompt for these in the dashboard rather than ever storing the actual
      # secret values in this version-controlled file. With either left blank, /history and
      # the history-save call both no-op gracefully; the rest of the app is unaffected.
      # DATABASE_URL: a Postgres connection string (e.g. from a free Neon or Supabase
      # project). HISTORY_ADMIN_PASSWORD: a password of your choosing that gates /history.
      - key: DATABASE_URL
        sync: false
      - key: HISTORY_ADMIN_PASSWORD
        sync: false
